<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2229">
<title>Culinaire wereld reis</title>
<style>
:root{--nacht:#0c2229;--tekst:#ece6d6;--dim:#9fb3b0;--saffraan:#f0a93a;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 30%,#14404a 0,var(--nacht) 70%);color:var(--tekst);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px 0}
h1{font:italic 400 1.3rem/1.2 var(--serif);margin:0}
#teller{margin:0;font-size:.85rem;color:var(--dim);text-align:right}
#bol{flex:1;min-height:0;display:grid;place-items:center;padding:4px}
canvas{display:block}
#info{text-align:center;padding:0 20px;min-height:7.5rem;display:flex;flex-direction:column;justify-content:center}
#groot{font:400 clamp(2rem,9vw,3rem)/1.1 var(--serif)}
#klein{color:var(--dim);margin-top:.4rem;min-height:1.5em}
#knoppen{display:flex;gap:12px;justify-content:center;padding:8px 20px 20px;min-height:80px}
button{flex:1;max-width:240px;min-height:52px;padding:0 20px;border-radius:14px;border:1px solid #3d6c6a;background:transparent;color:var(--tekst);font:600 1rem system-ui,sans-serif;cursor:pointer}
button.hoofd{background:var(--saffraan);border-color:var(--saffraan);color:var(--nacht)}
button:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
[hidden]{display:none!important}
#nav{display:flex;gap:8px;padding:10px 20px 0}
button.tab{flex:none;max-width:none;min-height:40px;padding:0 16px;border-radius:10px;font-weight:500;color:var(--dim)}
button.tab.actief{color:var(--nacht);background:var(--tekst);border-color:var(--tekst)}
#overzicht{flex:1;min-height:0;overflow:auto;padding:12px 20px 24px}
h2{font:400 1.4rem/1.2 var(--serif);margin:8px 0 12px}
.rij{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid rgba(236,230,214,.12)}
.rij .v{font-size:1.5rem}
.rij .n{flex:1;font:400 1.15rem var(--serif)}
.rij .d{color:var(--dim);font-size:.9rem}
.rij.afgekeurd .n{font-size:1rem;color:var(--dim)}
</style>
</head>
<body>
<header><h1>Culinaire wereld reis</h1><p id="teller"></p></header>
<nav id="nav"><button class="tab actief" data-s="trekken">Trekken</button><button class="tab" data-s="overzicht">Overzicht</button></nav>
<section id="overzicht" hidden></section>
<main id="bol"><canvas id="c" aria-label="Wereldbol"></canvas></main>
<section id="info" aria-live="polite"><div id="groot"></div><div id="klein"></div></section>
<footer id="knoppen"></footer>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="data/landen.js"></script>
<script>
const $ = s => document.querySelector(s);
const LAND = {}; LANDEN.forEach(l => LAND[l.c] = l);
const vlag = c => String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0)));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 30) : ms));
const vandaag = () => new Date().toISOString().slice(0, 10);

/* Opslag op de Raspberry via de Flask-API */
let S = { ronde: 1, getrokken: [], afgekeurd: [] };
async function api(pad, data) {
  const r = await fetch('api/' + pad, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

const getrokkenIds = () => new Set(S.getrokken.filter(x => x.ronde === S.ronde).map(x => x.land));
const pot = () => { const g = getrokkenIds(); return LANDEN.filter(l => !g.has(l.c)); };
function willekeurig(n) { /* eerlijke trekking zonder modulo-bias */
  const max = Math.floor(4294967296 / n) * n, b = new Uint32Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= max);
  return b[0] % n;
}
function teller() {
  $('#teller').textContent = (S.ronde > 1 ? 'Ronde ' + S.ronde + '. ' : '') + 'Nog ' + pot().length + ' van ' + LANDEN.length + ' in de pot';
}

/* Wereldbol */
let W, R0, proj, path, ctx, features = [], poly = {}, rot = [5, 20], schaal = 1, gekozen = null, bezig = false, vId = 0;
function maat() {
  const r = $('#bol').getBoundingClientRect(), s = Math.max(200, Math.floor(Math.min(r.width, r.height) - 8)), d = devicePixelRatio || 1, c = $('#c');
  W = s; c.style.width = c.style.height = s + 'px'; c.width = c.height = s * d;
  ctx = c.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
  R0 = s / 2 - 8;
  proj = d3.geoOrthographic().translate([s / 2, s / 2]).clipAngle(90).precision(0.6);
  path = d3.geoPath(proj, ctx);
}
function zichtbaar(l) { return d3.geoDistance([l.lon, l.lat], [rot[0], rot[1]]) < 1.45; }
function teken(t) {
  const r = R0 * schaal, m = W / 2;
  proj.scale(r).rotate([-rot[0], -rot[1]]);
  ctx.clearRect(0, 0, W, W);
  const g = ctx.createRadialGradient(m - r * .3, m - r * .35, r * .1, m, m, r);
  g.addColorStop(0, '#1d4d58'); g.addColorStop(1, '#0a2128');
  ctx.beginPath(); ctx.arc(m, m, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); path(d3.geoGraticule10()); ctx.strokeStyle = 'rgba(236,230,214,.07)'; ctx.lineWidth = .6; ctx.stroke();
  ctx.beginPath(); path({ type: 'FeatureCollection', features }); ctx.fillStyle = '#3f726c'; ctx.fill();
  ctx.strokeStyle = '#0c2229'; ctx.lineWidth = .5; ctx.stroke();
  const eerder = getrokkenIds();
  eerder.forEach(c => { const l = LAND[c]; if (poly[l.n]) { ctx.beginPath(); path(poly[l.n]); ctx.fillStyle = '#b4822f'; ctx.fill(); } else if (zichtbaar(l)) punt(l, 3, '#b4822f'); });
  if (gekozen) {
    const p = Math.sin(t / 260);
    if (poly[gekozen.n]) {
      ctx.save(); ctx.shadowColor = '#f0a93a'; ctx.shadowBlur = 16 + 8 * p;
      ctx.beginPath(); path(poly[gekozen.n]); ctx.fillStyle = '#f0a93a'; ctx.fill(); ctx.restore();
    }
    if (zichtbaar(gekozen)) {
      const q = proj([gekozen.lon, gekozen.lat]);
      ctx.beginPath(); ctx.arc(q[0], q[1], 6 + (t / 40 % 22), 0, 7); ctx.strokeStyle = 'rgba(255,210,122,' + (1 - (t / 40 % 22) / 22) + ')'; ctx.lineWidth = 1.5; ctx.stroke();
      if (!poly[gekozen.n]) punt(gekozen, 4, '#f0a93a');
    }
  }
  ctx.beginPath(); ctx.arc(m, m, r, 0, 7); ctx.strokeStyle = 'rgba(240,169,58,.25)'; ctx.lineWidth = 1.2; ctx.stroke();
}
function punt(l, rad, kleur) { const q = proj([l.lon, l.lat]); ctx.beginPath(); ctx.arc(q[0], q[1], rad, 0, 7); ctx.fillStyle = kleur; ctx.fill(); }
function tick(t) { if (!bezig && !reduce && !gekozen) rot[0] += 0.06; teken(t); requestAnimationFrame(tick); }
function vlieg(l, s, ms) {
  const id = ++vId;
  return new Promise(res => {
    const a = [...rot], sa = schaal, t0 = performance.now(), dl = (((l.lon - a[0]) % 360) + 540) % 360 - 180;
    const e = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    (function f(now) {
      if (id !== vId) return res();
      const t = reduce ? 1 : Math.min(1, (now - t0) / ms), k = e(t);
      rot = [a[0] + dl * k, a[1] + (l.lat - a[1]) * k]; schaal = sa + (s - sa) * k;
      t < 1 ? requestAnimationFrame(f) : res();
    })(t0);
  });
}

/* Interface */
function knoppen(lijst) {
  const k = $('#knoppen'); k.innerHTML = '';
  lijst.forEach(([tekst, fn, hoofd]) => { const b = document.createElement('button'); b.textContent = tekst; if (hoofd) b.className = 'hoofd'; b.onclick = fn; k.appendChild(b); });
}
const toon = (groot, klein) => { $('#groot').textContent = groot; $('#klein').textContent = klein; };
const toonLand = (l, klein) => toon(vlag(l.c) + ' ' + l.nl, klein);

async function trek() {
  if (bezig) return; bezig = true;
  if (!pot().length) { S.ronde++; teller(); }
  const p = pot(), w = p[willekeurig(p.length)];
  gekozen = null; knoppen([]);
  /* Voorbijkomende landen die het niet worden, steeds langzamer */
  const rest = p.filter(x => x !== w), n = Math.min(18, rest.length);
  let ms = 70;
  for (let i = 0; i < n; i++) {
    const l = rest.splice(willekeurig(rest.length), 1)[0];
    toonLand(l, 'Dit wordt het niet'); vlieg(l, 1, Math.max(ms * 1.5, 120));
    await sleep(ms); ms *= 1.14;
  }
  /* Countdown, ondertussen draait de bol naar het winnende land */
  vlieg(w, 1, 2800);
  for (const c of [3, 2, 1]) { toon(String(c), 'Het lot beslist'); await sleep(950); }
  /* Onthulling */
  gekozen = w;
  toonLand(w, 'Jouw volgende culinaire bestemming');
  await vlieg(w, 1.45, 1400);
  bezig = false;
  knoppen([['Toch niet', () => afkeur(w)], ['Dit wordt het', () => accepteer(w), true]]);
}
const datumNl = d => new Date(d + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
const opslagFout = () => { $('#klein').textContent = 'Opslaan mislukt, probeer het nog een keer.'; };
async function accepteer(w) {
  try { S = await api('trek', { land: w.c }); } catch (e) { return opslagFout(); }
  teller();
  toonLand(w, 'Vastgelegd op ' + datumNl(S.getrokken[S.getrokken.length - 1].datum));
  vlieg(w, 1, 900);
  knoppen([['Trek nog een land', trek, true]]);
}
async function afkeur(w) {
  try { S = await api('afkeur', { land: w.c }); } catch (e) { return opslagFout(); }
  gekozen = null; toon('Afgekeurd', w.nl + ' blijft in de pot');
  vlieg(w, 1, 900);
  knoppen([['Trek opnieuw', trek, true]]);
}

/* Overzicht */
function rij(x, klas) {
  const l = LAND[x.land], d = document.createElement('div'); d.className = 'rij ' + (klas || '');
  [['v', vlag(l.c)], ['n', l.nl], ['d', datumNl(x.datum)]].forEach(([k, t]) => { const s = document.createElement('span'); s.className = k; s.textContent = t; d.appendChild(s); });
  return d;
}
function overzicht() {
  const o = $('#overzicht'); o.innerHTML = '';
  const kop = t => { const h = document.createElement('h2'); h.textContent = t; o.appendChild(h); };
  kop(S.getrokken.length ? 'Getrokken landen: ' + S.getrokken.length : 'Nog geen landen getrokken');
  [...S.getrokken].reverse().forEach(x => o.appendChild(rij(x)));
  if (S.afgekeurd.length) { kop('Afgekeurd'); [...S.afgekeurd].reverse().forEach(x => o.appendChild(rij(x, 'afgekeurd'))); }
}
function scherm(naam) {
  const o = naam === 'overzicht';
  ['#bol', '#info', '#knoppen'].forEach(s => $(s).hidden = o); $('#overzicht').hidden = !o;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('actief', t.dataset.s === naam));
  if (o) overzicht(); else maat();
}

/* Start */
maat(); addEventListener('resize', maat);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => scherm(t.dataset.s));
Promise.all([api('state'), fetch('data/world.json').then(r => r.json())]).then(([st, w]) => {
  S = st; teller();
  features = topojson.feature(w, w.objects.countries).features;
  features.forEach(f => poly[f.id] = f);
  toon('Welk land is aan de beurt?', '');
  knoppen([['Trek een land', trek, true]]);
}).catch(() => toon('Laden mislukt', 'Controleer of de server draait.'));
requestAnimationFrame(tick);
</script>
</body>
</html>
